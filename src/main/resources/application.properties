spring.application.name=lume-ristorante

# ===== Database MySQL =====
# Il database viene creato da solo al primo avvio.
# Utente e password si possono cambiare con le variabili d'ambiente DB_USER e DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:lume_ristorante}?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ===== Intelligenza artificiale (Groq tramite Spring AI) =====
# La chiave NON va scritta qui: impostala nella variabile d'ambiente GROQ_API_KEY
# (chiave gratuita su https://console.groq.com/keys). Senza chiave l'app funziona,
# solo le funzioni AI mostrano un avviso.
spring.ai.openai.api-key=${GROQ_API_KEY:chiave-non-configurata}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=0.6
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=4s
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ===== Ristorante =====
lume.coperto=3.50
lume.capienza-per-turno=40
lume.durata-tavolo-minuti=120

# ===== Varie =====
server.port=8080
server.servlet.session.timeout=8h
spring.thymeleaf.cache=false
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm
